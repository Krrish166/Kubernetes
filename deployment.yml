apiVersion: apps/v1
kind:deployment
Metadata:
    name:python-app
spec:
  replicas:2
  selector:
    matchLabels:
      app:python-app
  template:
    metadata:
      labels:
       app:python-app
    spec:
      containers:
       - name:python-app
         image:python-app:latest
         ports:
          - containerPort:5000